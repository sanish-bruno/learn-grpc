syntax = "proto3";

package product;

enum Category {
  SMARTPHONE = 0;
  CAMERA = 1;
  LAPTOPS = 2;
  HEADPHONES = 3;
  CHARGERS = 4;
  SPEAKERS = 5;
  TELEVISIONS = 6;
  MODEMS = 7;
  KEYBOARD = 8;
  MICROPHONES = 9;
}

message ProductId {
  int32 id = 1;
}

message ProductItem {
  int32 id = 1;
  string name = 2;
  string description = 3;
  float price = 4;
  Category category = 5;
}

message ProductItems {
  repeated ProductItem products = 1;
}

message ProductUpdate {
  ProductItem product = 1;
  UpdateType type = 2;
  string timestamp = 3;
  enum UpdateType {
    CREATED = 0;
    MODIFIED = 1;
    DELETED = 2;
  }

}

message PriceAlert {
  int32 product_id = 1;
  float target_price = 2;
  AlertType type = 3;
  enum AlertType {
    PRICE_ABOVE = 0;
    PRICE_BELOW = 1;
  }

}

service Product {
  rpc CreateProduct (ProductItem) returns (ProductItem);
  rpc ReadProduct (ProductId) returns (ProductItem);
  rpc WatchProductUpdates (ProductId) returns (stream ProductUpdate);
}

